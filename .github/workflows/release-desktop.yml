name: Build and release desktop packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build without publishing
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - all
      version:
        description: Artifact version for a manual candidate build
        required: true
        default: v0.4.11-rc1
        type: string
      publish_prerelease:
        description: Publish successful manual-build artifacts as a public candidate prerelease
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind package version to the application source
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          app_version="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('annotation_app/app.py').read_text(encoding='utf-8')
          match = re.search(r'^APP_VERSION\s*=\s*["\x27]lma_studio_(v[0-9]+\.[0-9]+\.[0-9]+)["\x27]', text, re.M)
          if not match:
              raise SystemExit('Canonical APP_VERSION not found')
          print(match.group(1))
          PY
          )"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            if [[ "$version" != "$app_version" ]]; then
              echo "Formal tag must exactly equal APP_VERSION: $version != $app_version" >&2
              exit 1
            fi
          else
            requested="${REQUESTED_VERSION:-dev-candidate}"
            if [[ "$requested" == "dev-candidate" ]]; then
              version="${app_version}-dev"
            else
              version="$requested"
            fi
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "Invalid candidate version: $version" >&2
              exit 1
            fi
            if [[ "${version%%-*}" != "$app_version" ]]; then
              echo "Candidate base version must equal APP_VERSION: $version vs $app_version" >&2
              exit 1
            fi
          fi
          expected_heading="# LMA Studio ${app_version} Release Notes"
          if ! grep -Fqx "$expected_heading" README_RELEASE.md; then
            echo "README_RELEASE.md heading must be: $expected_heading" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare_version
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.prepare_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements-win.txt
      - name: Test and build Windows package
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & packaging/windows/build_windows.ps1 -PythonExe $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "release/LMA-Studio-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist/LMAStudio/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lma-studio-windows-x64
          path: |
            release/LMA-Studio-*-windows-x64.zip
            release/LMA-Studio-*-windows-x64.zip.sha256
          if-no-files-found: error

  build-macos-arm64:
    needs: prepare_version
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: packaging/macos/requirements-macos.txt
      - name: Test and build macOS ARM64 package
        shell: bash
        run: LMA_STUDIO_VERSION="$VERSION" bash packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lma-studio-macos-arm64
          path: |
            release/LMA-Studio-*-macos-arm64.zip
            release/LMA-Studio-*-macos-arm64.zip.sha256
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push'
    needs:
      - prepare_version
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archives=(
            "LMA-Studio-${VERSION}-windows-x64.zip"
            "LMA-Studio-${VERSION}-macos-arm64.zip"
          )
          for archive in "${archives[@]}"; do
            test -f "release-assets/$archive"
            test -f "release-assets/$archive.sha256"
            (
              cd release-assets
              sha256sum --check "$archive.sha256"
            )
          done
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.zip \
            release-assets/*.sha256 \
            --verify-tag \
            --title "LMA Studio $GITHUB_REF_NAME" \
            --notes-file README_RELEASE.md

  publish-prerelease:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_prerelease == true &&
      needs.prepare_version.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped')
    needs:
      - prepare_version
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify candidate archives
        shell: bash
        run: |
          shopt -s nullglob
          checksum_files=(release-assets/*.zip.sha256)
          if [[ ${#checksum_files[@]} -eq 0 ]]; then
            echo "No candidate checksum files were downloaded" >&2
            exit 1
          fi
          for checksum_file in "${checksum_files[@]}"; do
            (
              cd release-assets
              sha256sum --check "$(basename "$checksum_file")"
            )
          done
      - name: Publish public candidate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ needs.prepare_version.outputs.version }}
        shell: bash
        run: |
          candidate_tag="candidate-${CANDIDATE_VERSION}"
          gh release create "$candidate_tag" \
            release-assets/*.zip \
            release-assets/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "LMA Studio ${CANDIDATE_VERSION}" \
            --notes "Public test candidate. GitHub Latest remains the stable release. This candidate must pass mouse-level desktop validation before promotion. Source workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
